<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 4 - Interactive Logic</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>What Should I Do Next?</h1>

        <p id="question">
            Choose how you are feeling right now.
        </p>

        <div class="buttons">
            <button id="focused-button">Focused</button>
            <button id="creative-button">Creative</button>
            <button id="tired-button">Tired</button>
        </div>

        <div id="result-box">
            <h2 id="result-title">Your result will appear here.</h2>
            <p id="result-text">
                Your choice will change the page using JavaScript.
            </p>
        </div>

        <p id="state-text">Current state: start</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
